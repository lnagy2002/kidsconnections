<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Word Search</title>
<style>
@import url('./theme.css');

.wrap { display:flex; justify-content:center; }
.container { display:flex; margin:0 auto; flex-wrap:wrap; }
.left { padding:1rem; }
.right { padding:1rem; }

.board{
  display:grid;
  gap:5px;
  justify-content:center;
  user-select:none; touch-action:none;
  cursor:pointer;
}

.cell{
  width:50px; height:50px;
  background:#0f4160;
  color:#a9f4f4;
  font-weight:600; font-size:1.3rem;
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .15s ease;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
  user-select:none;
}

@keyframes pulse {
  0%   { transform:scale(1); box-shadow:0 0 0 #e76f51; }
  50%  { transform:scale(1.15); box-shadow:0 0 18px #e76f51aa; }
  100% { transform:scale(1.05); box-shadow:0 0 10px #e76f51aa; }
}

.cell.sel{
  background:var(--maybe);
  color:#000;
  animation:pulse .4s ease;
}
.cell.found{
  background:var(--ok)!important; color:#000;
}
/* New: if a found tile is currently selected, keep it green but show a subtle outline/pulse */
.cell.found.sel{
  outline:2px solid #fff3; animation:pulse .4s ease;
}

.list{flex:1;min-width:260px;background:#0b1f40;border-radius:14px;padding:14px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.list h3{margin:0;font-size:17px;font-weight:600;color:#e8f2f2}
.list .count{color:var(--muted);font-size:16px}
ul.words{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.words li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#0f3550;color:#e8f2f2;font-weight:700;letter-spacing:.02em}
ul.words li.found{background:rgba(74,222,128,.22);color:var(--ok)}
ul.words li.found .w{text-decoration:line-through}
ul.words li.found::before{
  content:"✓";flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:var(--ok);color:#0b2a1e;font-size:14px;font-weight:900
}
/* Messages: same soft box as the other games */
.status:not(:empty){
  width:fit-content;max-width:calc(100% - 32px);box-sizing:border-box;
  margin:8px auto 18px;padding:10px 24px;border-radius:14px;
  background:#2b4a5e;font-size:17px;text-align:center;color:var(--muted)
}
.status.good{color:var(--ok)}
.status.bad{color:#f4917b}

@media (max-width:700px){
  .left,.right{flex:0 0 100%;}
  .cell{width:40px; height:40px; font-weight:500; font-size:1rem;}
  .board{gap:1px;}
  ul.words{grid-template-columns:repeat(2,minmax(0,1fr))}
  .status:not(:empty){margin:10px auto 0}
}
</style>

<link rel="stylesheet" href="./games-utils.css">
<script src="https://lnagy2002.github.io/kidsconnections/games-menu.js" defer data-menu="https://lnagy2002.github.io/kidsconnections/games-menu.json"></script>
<script src="https://lnagy2002.github.io/kidsconnections/games-utils.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KFSR46Z6C8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-KFSR46Z6C8');
</script>
</head>
<body>
<main class="main">
  <div>
    <script src="https://lnagy2002.github.io/kidsconnections/header.js" data-title="Word Search"></script>
  </div>

  <div class="section"></div>

  <div class="wrap">
    <div class="container">
      <div class="left"><div id="board" class="board"></div><div class="status" id="status" role="status"></div></div>
      <div class="right">
        <div class="list">
          <div class="list-head"><h3>Find These Words</h3><span class="count" id="wordCount"></span></div>
          <ul id="wordList" class="words"></ul>
        </div>
      </div>
    </div>
  </div>
</main>
<div>
  <script src="https://lnagy2002.github.io/kidsconnections/footer.js"></script>
</div>

<script>
(function(){
  // ---------- Config (levels & word banks) ----------
  const LEVELS = {
    easy:   { words: ["AERIAL","LOGIC","MIND","BRAIN","SHAPE","GRID","TILE","PATH"] },
    medium: { words: ["ALGORITHM","PUZZLE","PATTERN","REASON","MEMORY","STRATEGY","SEARCH","CURIOUS"] },
    hard:   { words: ["NEUROPLASTIC","DEDUCTION","CREATIVITY","SEQUENCE","SYMMETRY","CONNECT","OPTIMIZE","ITERATION","FUNCTION"] }
  };

  const SIZES = {
    easy:   { size: 8},
    medium: { size: 10},
    hard:   { size: 12}
  };

  // Directions words can run in (dx,dy). Easy reads normally (across, down),
  // medium adds diagonals, hard adds every backwards direction too.
  const E=[1,0], S=[0,1], SE=[1,1], NE=[1,-1], W=[-1,0], N=[0,-1], NW=[-1,-1], SW=[-1,1];
  const LEVEL_DIRS = {
    easy:   [E, S],
    medium: [E, S, SE, NE],
    hard:   [E, S, SE, NE, W, N, NW, SW]
  };
  let DIRS = LEVEL_DIRS.easy;

  const elBoard = document.getElementById('board');
  const elWordList = document.getElementById('wordList');
  const elStatus = document.getElementById('status');

  let grid = [], size = 10, placed = new Map(); // word -> array of {x,y}
  let found = new Set();
  let dragging = false, sel = []; // selection path of {x,y,el}
  let lockedDir = null; // direction vector once 2nd cell chosen

  function randInt(n){ return Math.floor(Math.random()*n); }
  function inBounds(x,y){ return x>=0 && y>=0 && x<size && y<size; }
  function clearStatus(msg="", tone=""){ elStatus.textContent = msg; elStatus.className = 'status' + (tone ? ' ' + tone : ''); }
  function updateCount(){ document.getElementById('wordCount').textContent = `${found.size} of ${placed.size}`; }
  function alpha(){ return String.fromCharCode(65 + randInt(26)); }
  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=randInt(i+1); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

  // ---------- Grid generation ----------
  function newEmptyGrid(n){ return Array.from({length:n},()=>Array(n).fill(null)); }


  // -----------------------
  // Load today's words; if that file isn't there yet, use yesterday's
  // -----------------------
  function fileDate(daysAgo){
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    return String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + d.getFullYear();
  }

  async function loadWordsList() {
    const level = getQueryParam('level')  || 'easy';
    gtag('event', 'strands_load_level_'  + level, { app: 'strands' });

    for (const daysAgo of [0, 1]) {
      try {
        const r = await fetch('https://lnagy2002.github.io/kidsconnections/data/strands-' + fileDate(daysAgo) + ".json", { cache: 'no-store' });
        if (r.ok) return await r.json();
      } catch (e) { /* try the next day */ }
    }
    gtag('event', 'strands_failed_loading_level_'  + level, { app: 'strands' });
    // last resort: the built-in list
    return LEVELS;
  }

  function canPlace(word, x, y, dx, dy, grid){
    for(let i=0;i<word.length;i++){
      const nx = x + dx*i, ny = y + dy*i;
      if(!inBounds(nx,ny)) return false;
      const cur = grid[ny][nx];
      if(cur && cur !== word[i]) return false;
    }
    return true;
  }

  // Try every start square and direction in random order, so a word only fails if it truly can't fit
  function placeWord(word, grid){
    const options = [];
    for(let y=0;y<size;y++) for(let x=0;x<size;x++) for(const d of DIRS) options.push([x,y,d]);
    for(const [x,y,[dx,dy]] of shuffle(options)){
      if(canPlace(word,x,y,dx,dy,grid)){
        const coords=[];
        for(let i=0;i<word.length;i++){
          const nx=x+dx*i, ny=y+dy*i;
          grid[ny][nx]=word[i];
          coords.push({x:nx,y:ny});
        }
        placed.set(word, coords);
        return true;
      }
    }
    return false;
  }

  function fillBlanks(grid){
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        if(!grid[y][x]) grid[y][x] = alpha();
      }
    }
  }

  function renderBoard(){
    elBoard.style.gridTemplateColumns = `repeat(${size}, max-content)`;
    elBoard.innerHTML = '';
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        const div = document.createElement('div');
        div.className = 'cell';
        div.textContent = grid[y][x];
        div.dataset.x = x;
        div.dataset.y = y;
        elBoard.appendChild(div);
      }
    }
  }

  function renderList(words){
    elWordList.innerHTML = '';
    for(const w of words){
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.className = 'w';
      span.textContent = w;
      li.appendChild(span);
      li.id = `word-${w}`;
      elWordList.appendChild(li);
    }
  }

  function markFound(word){
    const coords = placed.get(word) || [];
    for(const {x,y} of coords){
      const idx = y*size + x;
      const cell = elBoard.children[idx];
      cell.classList.remove('sel');
      cell.classList.add('found'); // persist green highlight
    }
    found.add(word);
    const li = document.getElementById(`word-${word}`);
    if(li) li.classList.add('found');
    updateCount();
    clearStatus(found.size === placed.size ? '🎉 All words found!' : `Found: ${word}`, 'good');
    if (found.size === placed.size) {
      celebrate?.(getQueryParam("level")||"easy"); // if you have a celebrate() elsewhere
      window.MindBitsProgress?.markDoneToday(`wordsearch-${(getQueryParam("level")||"easy").toLowerCase()}`);
    }
  }

  function resetSelection(){
    // Always clear the temporary selection glow—even on found tiles
    for(const s of sel){ s.el.classList.remove('sel'); }
    sel = [];
    lockedDir = null;
  }

  function dirFrom(a,b){
    const dx = Math.sign(b.x - a.x);
    const dy = Math.sign(b.y - a.y);
    return [dx,dy];
  }

  function areNeighbors(a,b){
    return Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y))===1;
  }

  // Check if the selected path matches any placed word (forward or backward)
  function checkSelection(){
    if(sel.length<2){ resetSelection(); return; }
    const path = sel.map(s=>grid[s.y][s.x]).join('');
    const rpath = path.split('').reverse().join('');

    for(const [word,coords] of placed.entries()){
      if(found.has(word)) continue;
      const w1 = coords.map(c=>grid[c.y][c.x]).join('');
      const w2 = w1.split('').reverse().join('');
      const selStr = path;
      const selRev = rpath;
      if(selStr===w1 || selStr===w2 || selRev===w1 || selRev===w2){
        if(sel.length === coords.length){
          markFound(word);
          resetSelection();
          return;
        }
      }
    }
    clearStatus('Not quite! Try another word.', 'bad');
    resetSelection();
  }

  function handlePointerDown(e){
    const target = e.target.closest('.cell');
    if(!target) return;
    // Allow starting on found tiles (intersections)
    dragging = true; sel=[]; lockedDir=null; clearStatus('');
    addToSelection(target);
  }
  function handlePointerMove(e){
    if(!dragging) return;
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.cell');
    if(!target) return;
    const last = sel[sel.length-1];
    const nx = +target.dataset.x, ny = +target.dataset.y;
    if(last && last.x===nx && last.y===ny) return;
    addToSelection(target);
  }
  function handlePointerUp(){
    dragging=false; checkSelection();
  }

  function addToSelection(target){
    const x = +target.dataset.x, y = +target.dataset.y;
    const cur = {x,y,el:target};

    if(sel.length===0){
      sel.push(cur); target.classList.add('sel'); return;
    }

    const last = sel[sel.length-1];
    if(!areNeighbors(last,cur)) return; // must be adjacent

    // Lock direction after second tile
    if(sel.length===1){ lockedDir = dirFrom(last,cur); }
    else{
      const d = dirFrom(last,cur);
      if(d[0]!==lockedDir[0] || d[1]!==lockedDir[1]) return; // must stay straight
    }

    // Prevent backtracking within current selection
    if(sel.some(s=>s.x===x && s.y===y)) return;

    target.classList.add('sel');
    sel.push(cur);
  }

  // ---------- Puzzle lifecycle ----------
  async function build(levelKey){
    const {size:sz} = SIZES[levelKey];
    size = sz; placed.clear(); found.clear();
    DIRS = LEVEL_DIRS[levelKey] || LEVEL_DIRS.easy;
    grid = newEmptyGrid(size);

    const list = await loadWordsList();
    const {words:words} = list[levelKey];
    const wordsUp = words.map(w=>w.toUpperCase());
    const sorted = [...wordsUp].sort((a,b)=>b.length-a.length);

    let placedCount=0;
    for(const w of sorted){ if(placeWord(w, grid)) placedCount++; }
    fillBlanks(grid);

    renderBoard();
    // Only list words that fit on the board, so the puzzle can always be finished
    renderList(wordsUp.filter(w => placed.has(w)));
    updateCount();

    elBoard.addEventListener('pointerdown', handlePointerDown);
    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);

    if (placedCount < wordsUp.length) console.warn(`Placed ${placedCount}/${wordsUp.length} words.`);
    clearStatus('');
  }

  // Init
  const level = getQueryParam('level') || 'easy';
  build(level);
})();
if (window.self !== window.top) {
  document.body.classList.add('embedded');
}
</script>
</body>
</html>
