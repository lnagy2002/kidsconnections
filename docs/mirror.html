<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kids' Mirror Match</title>
    <style>
         @import url('./theme.css');

        .section {
            margin-top: 15px;
            text-align: center;
        }

        .prompt-title {
            margin: 16px 0 6px;
            text-align: center;
            color: #8be3e3;
            font-size: 1.6rem;
        }

        .hint-line {
            margin: 0 0 6px;
            padding: 0 16px;
            text-align: center;
            color: var(--muted);
        }

        .help {
            width: 26px;
            height: 26px;
            margin-left: 8px;
            border-radius: 50%;
            border: 2px solid currentColor;
            background: transparent;
            color: inherit;
            font: inherit;
            font-size: 15px;
            font-weight: 800;
            line-height: 1;
            vertical-align: middle;
            cursor: pointer;
        }

        .tip {
            max-width: 560px;
            margin: 0 auto 8px;
            padding: 10px 16px;
            border-radius: 14px;
            background: #2b4a5e;
            color: var(--muted);
            text-align: center;
        }

        .board {
            display: grid;
            grid-template-columns: minmax(0, 2fr) auto minmax(0, 3fr);
            gap: 20px;
            max-width: 900px;
            margin: 16px auto;
            align-items: stretch;
        }

        /* Original picture in a yellow frame */
        .orig-frame {
            background: #f9e27d;
            border-radius: 20px;
            padding: 0 12px 12px;
            display: flex;
            flex-direction: column;
        }

        .orig-label {
            text-align: center;
            font-weight: 800;
            letter-spacing: .06em;
            color: #0e364b;
            padding: 8px 0 6px;
        }

        .orig-frame canvas {
            display: block;
            width: 100%;
            height: auto;
            margin: auto 0;
            border-radius: 14px;
        }

        /* Mirror picture between the original and the options */
        .mirror-note {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 96px;
            text-align: center;
        }

        .mirror-arrow {
            color: #8be3e3;
            font-size: 32px;
            line-height: 1;
        }

        .mirror-caption {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.3;
        }

        /* Answer options */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .opt {
            position: relative;
            display: grid;
            place-items: center;
            padding: 12px;
            border-radius: 16px;
            background: #fbfaf0;
            cursor: pointer;
            transition: transform .1s ease, box-shadow .2s ease, background-color .2s ease;
        }

        .opt:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
        }

        .opt canvas {
            display: block;
            width: min(62%, 190px);
            height: auto;
            border-radius: 10px;
        }

        .opt .tag {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #a8e6e6;
            color: #0e364b;
            font-weight: 900;
        }

        .opt.selected.correct {
            background-color: var(--ok);
        }

        .opt.selected.wrong {
            background-color: var(--bad);
            animation: shake 0.5s ease-in-out;
        }

        /* Feedback after picking an option */
        #feedback:not(:empty) {
            width: fit-content;
            max-width: 100%;
            box-sizing: border-box;
            margin: 8px auto 0;
            padding: 12px 28px;
            border-radius: 14px;
            background: #2b4a5e;
            font-size: 19px;
            text-align: center;
        }

        #feedback.good {
            color: var(--ok);
        }

        #feedback.bad {
            color: #f4917b;
        }

        .mob-only {
            display: none;
        }

        @media (max-width: 840px) {
            .desk-only {
                display: none;
            }

            .mob-only {
                display: revert;
            }

            .board {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .orig-frame {
                justify-self: center;
                width: 100%;
                max-width: 330px;
                box-sizing: border-box;
            }

            .board .section {
                margin: 4px 0 0;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        @keyframes shake {
            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }
            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }
            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }
            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }
    </style>
    <link rel="stylesheet" href="./games-utils.css">
    <script src="https://lnagy2002.github.io/kidsconnections/games-menu.js" defer data-menu="https://lnagy2002.github.io/kidsconnections/games-menu.json"></script>
    <script src="https://lnagy2002.github.io/kidsconnections/games-utils.js"></script>

</head>

<body>
    <main class="main">
      <div>
        <script src="https://lnagy2002.github.io/kidsconnections/header.js" data-title="Mirror Match"></script>
      </div>

        <h2 class="prompt-title">Find the mirror match!</h2>
        <p class="hint-line">
            Look carefully! In a mirror, left and right switch sides.
            <button type="button" class="help" id="helpBtn" aria-expanded="false" aria-controls="tip" title="More tips">?</button>
        </p>
        <div id="tip" class="tip" hidden>
            Look for clues like dots, arrows, and things that are off-center. Check which side they end up on.
        </div>

        <div class="board">
            <div class="orig-frame">
                <div class="orig-label">ORIGINAL</div>
                <canvas id="original" width="600" height="600" aria-label="original image"></canvas>
            </div>
            <div class="mirror-note desk-only" aria-hidden="true">
                <svg viewBox="0 0 60 96" width="54" height="86">
                    <defs>
                        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#d9f4ff" />
                            <stop offset="1" stop-color="#7cc8ec" />
                        </linearGradient>
                    </defs>
                    <ellipse cx="30" cy="48" rx="26" ry="44" fill="url(#glass)" stroke="#f9e27d" stroke-width="5" />
                    <path d="M18 30 L32 16 M17 44 L38 22" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8" />
                </svg>
                <div class="mirror-arrow">&rarr;</div>
                <div class="mirror-caption">A mirror flips left and right.</div>
            </div>
            <h3 class="section mob-only">Which one is flipped?</h3>
            <div class="grid" id="optionsGrid"></div>
        </div>
        <div id="feedback" role="status"></div>
    </main>

    <div>
      <script src="https://lnagy2002.github.io/kidsconnections/footer.js"></script>
    </div>
    <script>

    let MIRRORS = [];

    async function loadData() {
        const level = getQueryParam('level')  || 'easy';
        gtag('event', 'mirror_load_level_'  + level, { app: 'mirror' });
        try {
            const res = await fetch('https://lnagy2002.github.io/kidsconnections/data/mirror-' + formattedFileDate + ".json"); // <-- your JSON file
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            MIRRORS = await res.json();
            startLevel(level); // render it
        } catch (err) {
            gtag('event', 'mirror_failed_loading_level_'  + level, { app: 'mirror' });
            showMessage (`Couldn’t load data: ${err.message}`);
        }
    }

        const $ = s => document.querySelector(s);
        const create = (t, a = {}) => Object.assign(document.createElement(t), a);

        let rounds = [];
        let current = -1;
        let score = 0;

async function toImageBitmapCompat(dataUrl) {
  // Try createImageBitmap for PNG/JPG/etc.
  try {
    const resp = await fetch(dataUrl);
    const blob = await resp.blob();
    try {
      return await createImageBitmap(blob);
    } catch (e) {
      // Some browsers fail on SVG blobs -> fall back to <img> via blob URL
      return await blobToImage(blob);
    }
  } catch {
    // If even fetch fails (rare for data URLs), final fallback: direct <img> src
    return await urlToImage(dataUrl);
  }

  function blobToImage(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      // keep canvases untainted if you ever switch to remote assets:
      // img.crossOrigin = 'anonymous';
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = reject;
      img.src = url;
    });
  }

  function urlToImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      // img.crossOrigin = 'anonymous';
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = url;
    });
  }
}

        async function drawImageFit(ctx, img, transform = {
            flipX: false,
            flipY: false,
            rotate: 0
        }) {
            const canvas = ctx.canvas;
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cw = canvas.width,
                ch = canvas.height;
            const iw = img.width,
                ih = img.height;
            const scale = Math.min(cw / iw, ch / ih);
            const dw = iw * scale,
                dh = ih * scale;
            const dx = (cw - dw) / 2,
                dy = (ch - dh) / 2;
            ctx.translate(dx + dw / 2, dy + dh / 2);
            if (transform.rotate) ctx.rotate(transform.rotate * Math.PI / 180);
            ctx.scale(transform.flipX ? -1 : 1, transform.flipY ? -1 : 1);
            ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();
        }

        function makeOptionCanvas(w = 400, h = 400) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            return c;
        }

        function createRound(img) {
            const correct = {
                flipX: true,
                flipY: false,
                rotate: 0,
                label: "Mirror (horizontal)"
            };
            // The other three ways to turn the picture. Each looks different from the mirror
            // (mirror + 180° turn is the same as an upside-down flip, so it is not a separate choice).
            const distractors = [{
                    flipX: false,
                    flipY: false,
                    rotate: 0,
                    label: "Original"
                },
                {
                    flipX: false,
                    flipY: true,
                    rotate: 0,
                    label: "Vertical flip"
                },
                {
                    flipX: false,
                    flipY: false,
                    rotate: 180,
                    label: "Rotate 180°"
                }
            ];
            const options = [
                Object.assign({}, correct, { isCorrect: true }),
                ...distractors.map(d => Object.assign({}, d, { isCorrect: false }))
            ];
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return {
                img,
                options
            };
        }

        function showMessage  (text, tone = '') {
          const fb = document.getElementById('feedback');
          fb.textContent = text;
          fb.className = tone;
        }

        async function startLevel(lvl) {
            // document.getElementById('levelBadge').textContent = "Level: " + (lvl.charAt(0).toUpperCase() + lvl.slice(1));
            showMessage  ("");
            // document.getElementById('resultBadge').textContent = "—";
            score = 0;
            // document.getElementById('score').textContent = "Score: 0";
            rounds = [];
            current = -1;
            console.log (MIRRORS[lvl][0])
            let pool = MIRRORS[lvl];
            console.log (pool)
            const bitmaps = [];
            for (const url of pool) {
                const bmp = await toImageBitmapCompat(url);
                bitmaps.push(bmp);
            }
            rounds = bitmaps.map(b => createRound(b));
            current = 0;
            renderRound();
        }

        async function renderRound() {
            // const progress = document.getElementById('progress');
            // const scoreEl = document.getElementById('score');
            // const nextBtn = document.getElementById('nextBtn');
            const grid = document.getElementById('optionsGrid');
            // const badge = document.getElementById('resultBadge');

            if (current < 0 || current >= rounds.length) return;
            // progress.textContent = "Round " + (current + 1) + "/" + rounds.length;
            // scoreEl.textContent = "Score: " + score;
            // badge.textContent = "—";
            showMessage("");
            // nextBtn.disabled = true;

            const ctx = document.getElementById('original').getContext('2d');
            await drawImageFit(ctx, rounds[current].img, {
                flipX: false
            });

            grid.innerHTML = "";
            const labels = ["A", "B", "C", "D"];
            rounds[current].options.forEach((opt, idx) => {
                const cell = create('div', {
                    className: 'opt',
                    role: 'button',
                    tabIndex: 0,
                    'aria-label': 'Option ' + labels[idx]
                });
                const tag = create('span', { className: 'tag' });
                tag.textContent = labels[idx];
                cell.appendChild(tag);
                const c = makeOptionCanvas();
                cell.appendChild(c);
                drawImageFit(c.getContext('2d'), rounds[current].img, opt);
                cell.addEventListener('click', () => selectOption(cell, opt));
                cell.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectOption(cell, opt);
                    }
                });
                grid.appendChild(cell);
            });
        }

        function selectOption(cell, opt) {
            const grid = document.getElementById('optionsGrid');
            Array.from(grid.children).forEach(ch => ch.classList.remove('selected', 'correct', 'wrong'));
            void cell.offsetWidth; // restart the shake when the same wrong option is tapped again
            cell.classList.add('selected', opt.isCorrect ? 'correct' : 'wrong');
            // const badge = document.getElementById('resultBadge');
            if (opt.isCorrect) {
                showMessage("Nice! That’s the true mirror.", 'good');
                // badge.textContent = "Correct ✅";
                celebrate ();
                window.MindBitsProgress?.markDoneToday(`mirror-${(getQueryParam("level")||"easy").toLowerCase()}`);

                score++;
            } else {
                showMessage("Not quite. Look for left/right clues.", 'bad');
                // badge.textContent = "Try again ❌";
            }
            // document.getElementById('score').textContent = "Score: " + score;
            // document.getElementById('nextBtn').disabled = false;
        }

        // document.getElementById('nextBtn').addEventListener('click', () => {
        //     if (current < rounds.length - 1) {
        //         current++;
        //         renderRound();
        //     } else {
        //         document.getElementById('feedback').textContent = "All rounds done! 🎉 Choose another level.";
        //         // document.getElementById('resultBadge').textContent = "Finished";
        //         document.getElementById('nextBtn').disabled = true;
        //     }
        // });


        document.getElementById('helpBtn').addEventListener('click', (e) => {
            const tip = document.getElementById('tip');
            tip.hidden = !tip.hidden;
            e.currentTarget.setAttribute('aria-expanded', String(!tip.hidden));
        });

        // startLevel(getQueryParam('level')  || 'easy');
        loadData ();
        if (window.self !== window.top) {
          document.body.classList.add('embedded');
        }
    </script>
</body>
