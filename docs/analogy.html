<title>The Mind Bits · Daily Analogies</title>
<style>
@import url('./theme.css');


.shake {
    display: inline-block;
    /* so transform applies properly */
    animation: shake .45s ease-in-out;
}


.progress-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  /* font-size:16px; */
  margin-bottom:8px;
  font-size: 14px;
color: var(--muted);
  /* color:#27475a; */
}

.progress-bar {
  width:100%;
  height:8px;
  border-radius:999px;
  background:#dde8f0;
  overflow:hidden;
  position:relative;
}

.progress-fill {
  position:absolute;
  inset:0;
  width:0%;
  border-radius:inherit;
  background:var(--maybe);
  transition:width .25s ease-out;
}

#grid { max-width: 900px; margin: 0 auto; padding: 0 16px; }

.help {
  width: 28px; height: 28px; margin-left: 10px; border-radius: 50%;
  border: 2px solid currentColor; background: transparent; color: inherit;
  font: inherit; font-size: 15px; font-weight: 800; line-height: 1; vertical-align: middle; cursor: pointer;
}
.tip {
  max-width: 620px; margin: 0 auto 14px; padding: 10px 16px; border-radius: 14px;
  background: #2b4a5e; color: var(--muted); text-align: center;
}

/* Question card: SUN -> BRIGHT over ? -> ? */
.q-text {
  border-radius: 18px;
  padding: 18px 16px;
  background: #f9d95c;
  color: #0e364b;
  text-align: center;
  font-weight: 800;
  text-transform: uppercase;
  user-select: none;
  margin-bottom: 18px;
}
.q-pair {
  display: inline-flex; align-items: center; gap: 28px;
  font-size: clamp(22px, 4vw, 32px); line-height: 1.1;
  padding: 0 20px 10px; border-bottom: 3px solid #0e364b;
}
.q-blank { display: flex; justify-content: center; align-items: center; gap: 28px; margin-top: 12px; }
.q-slot {
  min-width: 80px; padding: 4px 12px; border-radius: 10px;
  background: #fbe9a3; font-size: clamp(18px, 3.2vw, 24px); line-height: 1.2;
}
.q-blank .arrow { font-size: clamp(18px, 3.2vw, 24px); }
.q-slot.filled { background: var(--ok); color: #083f2b; }

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  pointer-events: none;
  filter: grayscale(20%);
}

.choices{
  display: grid;
  grid-template-rows: repeat(4, auto);
  grid-auto-flow: column;  /* fill down the rows first */
  gap: 10px;
  margin-top: 15px;
}

.choice {
    display: flex;
    align-items: center;
    gap: 24px;
    min-height: 64px;
    padding: 8px 20px;
    border-radius: 14px;
    border: none;
    background: #fbfdfd;
    color: #0e364b;
    font-size: 20px;
    font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    line-height: 1.15;
    box-sizing: border-box;
    transition: transform .1s ease, box-shadow .2s ease;
}
.choice:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.2); }
.choice .letter {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: #8be3e3; color: #0e364b; font-size: 22px;
}
.choice .arrow, .q-text .arrow { font-weight: 700; }



 .choice.correct{ background: var(--ok); color: #083f2b }
 .choice.correct .letter { background: #fff; }

 .choice.wrong { background: var(--bad); color: #fff }
 .choice.wrong .letter { background: #fff; color: #0e364b; }


.choice.disable {
  pointer-events:none;
  opacity:.9;
}

/* Score left, Next in the middle, counter right */
.bottom-row {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  max-width: 900px; margin: 18px auto 0; padding: 0 16px; box-sizing: border-box;
  color: var(--muted);
}
.bottom-row[hidden] { display: none; }
.bottom-row .score-pill { justify-self: start; }
.bottom-row #qCounter { justify-self: end; }

.score-pill {
  padding:4px 10px;
  border-radius:999px;
  background: var(--key);
  border: 1px solid var(--border);
}

.score-pill.correct {
  animation:pulse .4s ease;
}

@keyframes pulse {
  0%   { transform:scale(1); box-shadow:0 0 0 #e76f51; }
  50%  { transform:scale(1.15); box-shadow:0 0 18px #e76f51aa; }
  100% { transform:scale(1.05); box-shadow:0 0 10px #e76f51aa; }
}


</style>
<link rel="stylesheet" href="./games-utils.css">
<script src="https://lnagy2002.github.io/kidsconnections/games-menu.js" defer data-menu="https://lnagy2002.github.io/kidsconnections/games-menu.json"></script>
<script src="./games-utils.js"></script>

<body>
  <main class="main">
  <div>
    <script src="./header.js" data-title="Word Analogies"></script>
  </div>
<h2 class="game-title">Choose the pair that matches the relationship.<button type="button" class="help" id="helpBtn" aria-expanded="false" aria-controls="tip" title="How to play">?</button></h2>
  <div id="tip" class="tip" hidden>
    Look at how the first two words go together. Then pick the pair that goes together <b>the same way</b>.
  </div>
  <div id="grid">

    <div class="q-text" id="qText">Loading question…</div>

    <div class="choices" id="choices"></div>
    <div id="message" class="game-message" role="status"></div>

  </div>
  <div class="bottom-row">
    <span class="score-pill" id="scorePill">Score: 0</span>
    <button class="btn primary" id="nextBtn" disabled>Next</button>
    <span id="qCounter">1 / 10</span>
  </div>
  <div>
    <script src="https://lnagy2002.github.io/kidsconnections/footer.js"></script>
  </div>
</main>

<script>
// ---------- Seeded RNG so order is stable per day+level ----------
function xmur3(str){
  let h = 1779033703 ^ str.length;
  for(let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = h << 13 | h >>> 19;
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
}

function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function shuffleSeeded(array, seedStr){
  const seedFn = xmur3(seedStr);
  const rand = mulberry32(seedFn());
  const arr = array.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ---------- Game state ----------
const DATA_URL = "https://lnagy2002.github.io/kidsconnections/data/";
const STATIC_URL = DATA_URL + "daily-analogies.json"; // old fixed set, only used if no daily file exists
let data = null;
let currentLevel = getQueryParam ("level") || "easy";
let questions = [];
let index = 0;
let score = 0;
const QUESTIONS_PER_DAY = 1; // one daily challenge, like the other games

// ---------- DOM ----------
const qCounter = document.getElementById("qCounter");
const scorePill = document.getElementById("scorePill");
// const progressFill = document.getElementById("progressFill");
const qText = document.getElementById("qText");
const choicesEl = document.getElementById("choices");
// const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");

// ---------- Load JSON: today's file, else yesterday's, else the old fixed set ----------
function fileDate(daysAgo){
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + d.getFullYear();
}

async function fetchJson(url){
  try {
    const res = await fetch(url + "?v=" + Date.now()); // cache-bust
    return res.ok ? await res.json() : null;
  } catch { return null; }
}

async function loadDaily(){
  data = await fetchJson(DATA_URL + "analogy-" + fileDate(0) + ".json")
      || await fetchJson(DATA_URL + "analogy-" + fileDate(1) + ".json")
      || await fetchJson(STATIC_URL);
  if (!data) {
    qText.textContent = "Error loading questions. Please try again later.";
    return;
  }
  setLevel(getQueryParam ("level") || "easy");
}

// Shuffle the 4 choices (same order for everyone today) and keep track of the right one
function shuffleChoices(q, seedStr){
  const order = shuffleSeeded([0, 1, 2, 3].slice(0, q.choices.length), seedStr);
  return { ...q, choices: order.map(i => q.choices[i]), answer: order.indexOf(q.answer) };
}

// ---------- Level handling ----------
function setLevel(level){
  currentLevel = level;

  if(!data || !data.levels || !data.levels[level]){
    qText.textContent = "No questions for this level.";
    return;
  }

  const base = data.levels[level];
  const todayStr = fileDate(0);
  questions = shuffleSeeded(base, todayStr + "-" + level)
    .slice(0, QUESTIONS_PER_DAY)
    .map((q, i) => shuffleChoices(q, `${todayStr}-${level}-${i}`));

  index = 0;
  score = 0;
  // With a single daily question there's nothing to count or move on to
  document.querySelector(".bottom-row").hidden = questions.length <= 1;
  renderQuestion();
}

// ---------- Render ----------
function renderQuestion(){
  const q = questions[index];
  qCounter.textContent = `${Math.min(index+1, questions.length)} / ${questions.length}`;
  scorePill.textContent = `Score: ${score}`;
  // progressFill.style.width = `${(index/QUESTIONS_PER_DAY)*100}%`;
  // feedbackEl.textContent = "";
  nextBtn.disabled = true;
  scorePill.classList.remove ("correct");
  if(!q){
    // finished
    qText.textContent = "You’ve completed today’s analogies!";
    choicesEl.innerHTML = "";
    // feedbackEl.textContent = `Final score: ${score} / ${QUESTIONS_PER_DAY}`;
    nextBtn.disabled = true;
    return;
  }

  renderQuestionCard(q);
  choicesEl.innerHTML = "";

  q.choices.forEach((choice, i) => {
    const div = document.createElement("div");
    div.className = "choice";
    div.dataset.index = i;

    const idxSpan = document.createElement("span");
    idxSpan.className = "letter";
    idxSpan.textContent = String.fromCharCode(65 + i);
    div.appendChild(idxSpan);

    div.appendChild(pairEl(splitPair(choice)));

    div.addEventListener("click", () => handleChoice(i, div));
    choicesEl.appendChild(div);
  });
}

// "sun : bright ::" -> ["sun", "bright"]
function splitPair(text){
  const parts = String(text).replace(/\s*::\s*$/, "").split(":").map(s => s.trim());
  return [parts[0] || "", parts.slice(1).join(":") || ""];
}

function el(tag, className, text){
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text != null) e.textContent = text;
  return e;
}

function pairEl([a, b], className = ""){
  const wrap = el("span", className);
  wrap.append(el("span", "", a), el("span", "arrow", " → "), el("span", "", b));
  return wrap;
}

// Yellow card: the question pair, a line, then "? -> ?" waiting for the answer
function renderQuestionCard(q){
  qText.innerHTML = "";
  const top = el("div", "q-pair");
  const [a, b] = splitPair(q.q);
  top.append(el("span", "", a), el("span", "arrow", "→"), el("span", "", b));
  const blank = el("div", "q-blank");
  blank.append(el("span", "q-slot", "?"), el("span", "arrow", "→"), el("span", "q-slot", "?"));
  qText.append(top, blank);
}

// After answering, show the right pair in the "? -> ?" boxes
function revealAnswer(q){
  const [c, d] = splitPair(q.choices[q.answer]);
  const slots = qText.querySelectorAll(".q-slot");
  slots[0].textContent = c; slots[1].textContent = d;
  slots.forEach(s => s.classList.add("filled"));
}

function handleChoice(i, el){
  const q = questions[index];
  const choiceEls = document.querySelectorAll(".choice");
  choiceEls.forEach(c => c.classList.add("disable"));

  if(i === q.answer){
    el.classList.add("correct");
    score++;
    scorePill.classList.add ("correct");
    // feedbackEl.textContent = "Correct.";
  } else {
    el.classList.add("wrong");
    el.classList.add("shake");
    // feedbackEl.textContent = "Not quite. The green one is correct.";
    choiceEls[q.answer].classList.add("correct");
  }

  scorePill.textContent = `Score: ${score}`;
  revealAnswer(q);
  nextBtn.disabled = false;
  if (index >= questions.length - 1) { nextBtn.disabled = true; finishGame(); }

  // progressFill.style.width = `${((index+1)/QUESTIONS_PER_DAY)*100}%`;
}

nextBtn.addEventListener("click", () => {
  if(index < questions.length - 1){
    index++;
    renderQuestion();
  } else {
    qText.textContent = "You’ve completed today’s analogies!";
    choicesEl.innerHTML = "";
    finishGame();
    // feedbackEl.textContent = `Final score: ${score} / ${QUESTIONS_PER_DAY}`;
    nextBtn.disabled = true;
  }
});

document.getElementById("helpBtn").addEventListener("click", (e) => {
  const tip = document.getElementById("tip");
  tip.hidden = !tip.hidden;
  e.currentTarget.setAttribute("aria-expanded", String(!tip.hidden));
});

// End of today's questions: celebrate and mark the game done
function finishGame(){
  const msgEl = document.getElementById("message");
  if (questions.length === 1) {
    const right = score === 1;
    const [c, d] = splitPair(questions[0].choices[questions[0].answer]);
    msgEl.textContent = right ? "🎉 You got it! Come back tomorrow for a new one." : `Good try! The answer was ${c} → ${d}.`;
    msgEl.className = "game-message" + (right ? " good" : "");
    if (right) celebrate(currentLevel);
  } else {
    msgEl.textContent = `🎉 All done! You got ${score} of ${questions.length} right.`;
    msgEl.className = "game-message good";
    celebrate(currentLevel);
  }
  window.MindBitsProgress?.markGameDone("analogy");
}

// ---------- Start ----------
loadDaily();


if (window.self !== window.top) {
  document.body.classList.add('embedded');
}
</script>
</body>
