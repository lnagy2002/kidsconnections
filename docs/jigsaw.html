<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jigsaw Puzzle</title>
  <style>

  @import url('./theme.css');

    /* Board and pieces share one size (--cell, set from script) so pieces match their squares */
    .play {
      --board: min(560px, calc(100vh - 250px), 58vw);
      --cell: 100px;
      display: grid;
      grid-template-columns: var(--board) minmax(260px, 420px);
      justify-content: center;
      align-items: start;
      gap: 24px;
      margin: 16px auto 8px;
      padding: 0 16px;
    }

    .title-main { margin: 18px 0 4px; text-align: center; color: #8be3e3; font-size: 1.9rem; }
    .subtitle { margin: 0 0 6px; padding: 0 16px; text-align: center; color: var(--muted); }

    .grid {
      display: grid; gap: 4px; background: #0b1f40; padding: 8px; border-radius: 20px;
      width: var(--board); aspect-ratio: 1/1; box-sizing: border-box; position: relative;
    }
    .cell { border-radius: 8px; background: #0c2350; outline: 2px dashed rgba(255,255,255,0.32); outline-offset: -2px; position: relative; }
    .cell.correct { outline: 2px solid rgba(88,214,141,0.8); }
    .cell.target { outline: 2px dashed #7fd6c2; background: #14214a; }

    .side {
      display: flex; flex-direction: column; gap: 12px;
      max-height: var(--board);
    }

    .topbar { display: flex; align-items: center; gap: 20px; }
    /* Same yellow card as the ORIGINAL picture in Mirror Match */
    .preview-wrap { margin: 0; flex: none; background: #f9e27d; border-radius: 18px; padding: 0 10px 10px; }
    .preview-wrap figcaption {
      text-align: center; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      color: #0e364b; font-size: 13px; padding: 7px 0 6px;
    }
    .preview {
      display: block; width: 140px; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px;
      background: #0f1736;
    }
    .progress {
      flex: 1; display: flex; align-items: center; gap: 10px;
      padding: 8px 18px 8px 8px; border-radius: 999px;
      background: #133a52; border: 1px solid rgba(255,255,255,.12);
      color: #fff; font-size: 17px; font-weight: 700;
    }
    .progress .count {
      flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
      background: #e8f5a3; color: #0e364b; font-size: 18px;
    }

    /* Laptop: one column per puzzle column, pieces shrink to fit */
    .tray {
      display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); align-content: start;
      gap: 14px; padding: 16px; border-radius: 20px;
      background: #1c4a5f; overflow-y: auto; flex: 1 1 auto; min-height: 120px;
      scrollbar-width: thin; scrollbar-color: rgba(139,227,227,.35) transparent;
    }
    .tray .piece { width: 100%; height: auto; aspect-ratio: 1/1; }

    .piece {
      position: relative; width: var(--cell); height: var(--cell); border-radius: 10px; cursor: grab; flex: none;
      box-sizing: border-box;
      background-size: var(--bgW) var(--bgH); background-repeat: no-repeat; background-image: var(--img);
      background-position: var(--bgX) var(--bgY); border: 2px solid rgba(255,255,255,0.15);
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .cell > .piece { width: 100%; height: 100%; border-radius: 8px; }
    .piece.dragging { cursor: grabbing; box-shadow: 0 12px 28px rgba(0,0,0,.45); transform: scale(1.05); }
    .piece.selected { border: 3px solid #7fd6c2; box-shadow: 0 0 14px rgba(127,214,194,.6); }
    .piece.locked { cursor: default; border-color: rgba(88,214,141,0.8); }
    .piece.wrong { animation: shake .45s ease-in-out; border-color: var(--bad); }
    .placeholder { visibility: hidden; }

    @keyframes shake {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .actions .btn:disabled { opacity: .45; cursor: default; }

    #message:not(:empty) {
      width: fit-content; max-width: calc(100% - 32px); box-sizing: border-box;
      margin: 8px auto 18px; padding: 12px 28px; border-radius: 14px;
      background: #2b4a5e; font-size: 19px; text-align: center;
    }
    #message.good { color: var(--ok); }

    @media (max-width: 840px) {
      .play {
        --board: min(94vw, 480px);
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 12px;
      }
      .side { max-height: none; width: var(--board); }
      .title-main { margin: 10px 0 2px; font-size: 1.5rem; }
      .subtitle { font-size: 14px; }
      .preview { width: 60px; border-radius: 8px; }
      .preview-wrap { padding: 4px; border-radius: 12px; }
      .preview-wrap figcaption { display: none; }
      .topbar { gap: 12px; }
      .progress { margin-top: 0; font-size: 16px; }
      .tray { gap: 8px; padding: 10px; border-radius: 16px; }
      .grid { gap: 3px; padding: 6px; border-radius: 16px; }
      /* Pieces sit in a two-row strip right under the board; swipe sideways for more */
      .tray {
        display: grid; grid-auto-flow: column; grid-template-columns: none; grid-template-rows: repeat(2, var(--cell));
        grid-auto-columns: var(--cell); overflow-x: auto; overflow-y: hidden;
        min-height: 0;
      }
      .tray .piece { touch-action: pan-x; width: var(--cell); height: var(--cell); }
      .actions { justify-content: center; }
    }
  </style>
  <link rel="stylesheet" href="./games-utils.css">
  <script src="https://lnagy2002.github.io/kidsconnections/games-menu.js" defer data-menu="https://lnagy2002.github.io/kidsconnections/games-menu.json"></script>
  <script src="https://lnagy2002.github.io/kidsconnections/games-utils.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KFSR46Z6C8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-KFSR46Z6C8');
  </script>
</head>
<body>
  <main class="main">
    <div>
      <script src="https://lnagy2002.github.io/kidsconnections/header.js" data-title="Jigsaw Puzzle"></script>
    </div>

    <h2 class="title-main">Build the picture</h2>
    <p class="subtitle">Drag a piece into its matching spot. On a phone, tap a piece, then tap its spot.</p>

    <div class="play" id="play">
      <section id="board" class="grid" aria-label="Jigsaw board"></section>
      <aside class="side">
        <div class="topbar">
          <figure class="preview-wrap">
            <figcaption>Picture preview</figcaption>
            <img id="preview" class="preview" alt="The finished picture" />
          </figure>
          <div id="progress" class="progress" aria-live="polite"></div>
        </div>
        <section id="tray" class="tray" aria-label="Pieces tray"></section>
        <div class="actions">
          <button class="btn" id="reshuffleBtn">Start Over</button>
          <button class="btn primary" id="returnLooseBtn" title="Send pieces in the wrong spot back to the tray">Return to Tray</button>
        </div>
      </aside>
    </div>
    <div id="message" role="status"></div>
  </main>
  <div>
    <script src="https://lnagy2002.github.io/kidsconnections/footer.js"></script>
  </div>
  <script>
  // -----------------------
  // Query helpers
  // -----------------------
  const LEVELS = { easy: 3, medium: 4, hard: 5 };
  function getParams() {
    const url = new URL(location.href);
    let lvlRaw = (url.searchParams.get('level')||'easy').toLowerCase();
    let n = LEVELS[lvlRaw] || Number(lvlRaw) || 3; // allow ?level=3
    n = Math.min(8, Math.max(2, Math.round(n))); // clamp 2..8
    return { n };
  }

  // -----------------------
  // Load the daily image list
  // -----------------------
  async function loadImageList() {
    const level = getQueryParam('level')  || 'easy';
    gtag('event', 'jigsaw_load_level_'  + level, { app: 'jigsaw' });

    try {
      const r = await fetch('https://lnagy2002.github.io/kidsconnections/data/images-' + formattedFileDate + ".json", { cache: 'no-store' }); // <-- your JSON file
      if (!r.ok) throw new Error('images.json missing');
      return await r.json();
    } catch (e) {
      gtag('event', 'jigsaw_failed_loading_level_'  + level, { app: 'jigsaw' });
      // final fallback: 1 image
      return { images: [{ id:'fallback', title:'Fallback', src:'https://picsum.photos/1200'}] };
    }
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // -----------------------
  // Elements & state
  // -----------------------
  const playEl  = document.getElementById('play');
  const boardEl = document.getElementById('board');
  const trayEl  = document.getElementById('tray');
  const previewEl = document.getElementById('preview');
  const progressEl = document.getElementById('progress');
  const messageEl = document.getElementById('message');

  let STATE = { n: 3, src: '', aspect: 1, selected: null, done: false };

  // Keep tray pieces the same size as the board squares
  function syncCellSize() {
    const cell = boardEl.querySelector('.cell');
    if (cell) playEl.style.setProperty('--cell', cell.getBoundingClientRect().width + 'px');
  }
  window.addEventListener('resize', syncCellSize);

  // Background size/position for piece (r, c): the photo is cropped to a centered
  // square (cover), so it is never stretched whatever its shape.
  function pieceBackground(n, r, c, aspect) {
    const w = aspect >= 1 ? n * aspect : n;   // photo size measured in pieces
    const h = aspect >= 1 ? n : n / aspect;
    const cropX = (w - n) / 2, cropY = (h - n) / 2;
    const pct = (offset, size) => size === 1 ? '0%' : `${((offset / (size - 1)) * 100).toFixed(4)}%`;
    return {
      bgW: `${(w * 100).toFixed(4)}%`,
      bgH: `${(h * 100).toFixed(4)}%`,
      bgX: pct(cropX + c, w),
      bgY: pct(cropY + r, h)
    };
  }

  // -----------------------
  // Building the puzzle
  // -----------------------
  function buildPuzzle() {
    const n = STATE.n;
    STATE.selected = null;
    STATE.done = false;
    messageEl.textContent = '';
    messageEl.className = '';

    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${n}, 1fr)`;
    playEl.style.setProperty('--cols', n);
    for (let i = 0; i < n * n; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.slot = i; // correct index
      cell.addEventListener('click', () => onCellTap(cell));
      boardEl.appendChild(cell);
    }

    trayEl.innerHTML = '';
    const order = Array.from({ length: n * n }, (_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    for (const i of order) {
      const r = Math.floor(i / n), c = i % n;
      const bg = pieceBackground(n, r, c, STATE.aspect);
      const piece = document.createElement('div');
      piece.className = 'piece';
      piece.style.setProperty('--img', `url("${STATE.src}")`);
      piece.style.setProperty('--bgW', bg.bgW);
      piece.style.setProperty('--bgH', bg.bgH);
      piece.style.setProperty('--bgX', bg.bgX);
      piece.style.setProperty('--bgY', bg.bgY);
      piece.dataset.correct = String(i);
      piece.addEventListener('pointerdown', onPiecePointerDown);
      piece.addEventListener('click', (e) => e.stopPropagation()); // taps are handled on pointerup
      trayEl.appendChild(piece);
    }

    syncCellSize();
    updateProgress();
  }

  function cellPiece(cell) {
    return cell.querySelector('.piece:not(.placeholder)');
  }

  function sendToTray(piece) {
    piece.parentElement?.classList?.remove('correct');
    piece.classList.remove('selected', 'wrong');
    trayEl.appendChild(piece);
  }

  // Put a piece into a square. A loose piece already there goes back to the tray.
  function placeInCell(piece, cell) {
    const current = cellPiece(cell);
    if (current === piece) return true;
    if (current) {
      if (current.classList.contains('locked')) return false;
      sendToTray(current);
    }
    piece.parentElement?.classList?.remove('correct');
    piece.classList.remove('selected', 'wrong');
    cell.appendChild(piece);

    if (Number(piece.dataset.correct) === Number(cell.dataset.slot)) {
      piece.classList.add('locked');
      cell.classList.add('correct');
    } else {
      void piece.offsetWidth; // restart the shake
      piece.classList.add('wrong');
      setTimeout(() => piece.classList.remove('wrong'), 600);
    }
    updateProgress();
    checkWin();
    return true;
  }

  // -----------------------
  // Tap to place: tap a piece, then tap a square
  // -----------------------
  function selectPiece(piece) {
    if (STATE.selected) STATE.selected.classList.remove('selected');
    STATE.selected = piece;
    if (piece) piece.classList.add('selected');
  }

  function onPieceTap(piece) {
    if (piece.classList.contains('locked')) return;
    const cell = piece.parentElement;
    // With a piece already picked, tapping a loose piece on the board swaps it out
    if (STATE.selected && STATE.selected !== piece && cell.classList.contains('cell')) {
      onCellTap(cell);
      return;
    }
    selectPiece(STATE.selected === piece ? null : piece);
  }

  function onCellTap(cell) {
    if (!STATE.selected || dragJustEnded) return;
    const piece = STATE.selected;
    selectPiece(null);
    if (!placeInCell(piece, cell)) selectPiece(piece); // square already done: keep the piece picked
  }

  // -----------------------
  // Dragging (mouse and touch)
  // -----------------------
  let drag = null;
  let dragJustEnded = false;

  function onPiecePointerDown(e) {
    const piece = e.currentTarget;
    if (piece.classList.contains('locked') || STATE.done) return;
    drag = { piece, id: e.pointerId, startX: e.clientX, startY: e.clientY, moved: false };
    try { piece.setPointerCapture(e.pointerId); } catch (err) { /* window listeners still track the pointer */ }
  }

  function liftPiece() {
    const { piece } = drag;
    const rect = piece.getBoundingClientRect();
    drag.origin = piece.parentElement;
    drag.originX = rect.left;
    drag.originY = rect.top;
    // keep the gap in the tray while the piece is lifted
    drag.placeholder = piece.cloneNode(false);
    drag.placeholder.className = 'piece placeholder';
    piece.parentElement.insertBefore(drag.placeholder, piece);
    document.body.appendChild(piece);
    Object.assign(piece.style, {
      position: 'fixed', left: rect.left + 'px', top: rect.top + 'px',
      width: rect.width + 'px', height: rect.height + 'px', zIndex: 1000
    });
    piece.classList.add('dragging');
    selectPiece(null);
  }

  function resetPieceStyle(piece) {
    piece.classList.remove('dragging');
    Object.assign(piece.style, { position: '', left: '', top: '', width: '', height: '', zIndex: '' });
  }

  function cellUnder(x, y) {
    for (const cell of boardEl.querySelectorAll('.cell')) {
      const r = cell.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cell;
    }
    return null;
  }

  function highlightTarget(cell) {
    boardEl.querySelectorAll('.cell.target').forEach(c => c !== cell && c.classList.remove('target'));
    if (cell) cell.classList.add('target');
  }

  window.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 8) return;
      drag.moved = true;
      liftPiece();
    }
    drag.piece.style.left = (drag.originX + dx) + 'px';
    drag.piece.style.top = (drag.originY + dy) + 'px';
    const r = drag.piece.getBoundingClientRect();
    highlightTarget(cellUnder(r.left + r.width / 2, r.top + r.height / 2));
  });

  function endDrag(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    const { piece, moved, placeholder, origin } = drag;
    drag = null;
    try { piece.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }

    if (!moved) {
      if (!cancelled) onPieceTap(piece);
      return;
    }

    const r = piece.getBoundingClientRect();
    const cell = cancelled ? null : cellUnder(r.left + r.width / 2, r.top + r.height / 2);
    highlightTarget(null);
    resetPieceStyle(piece);

    if (cell && placeInCell(piece, cell)) {
      placeholder.remove();
    } else {
      placeholder.replaceWith(piece); // back to where it came from
      if (origin && origin.classList.contains('cell')) origin.classList.remove('correct');
    }
    // the click that follows a drag should not count as a tap on a square
    dragJustEnded = true;
    setTimeout(() => { dragJustEnded = false; }, 0);
  }

  window.addEventListener('pointerup', (e) => endDrag(e, false));
  window.addEventListener('pointercancel', (e) => endDrag(e, true));

  // -----------------------
  // Progress & win
  // -----------------------
  function updateProgress() {
    const total = STATE.n * STATE.n;
    const placed = boardEl.querySelectorAll('.piece.locked').length;
    progressEl.innerHTML = `<span class="count">${placed}</span><span>of ${total} pieces placed</span>`;
    // Only useful when a piece sits in the wrong square
    document.getElementById('returnLooseBtn').disabled = !boardEl.querySelector('.piece:not(.locked)');
  }

  function checkWin() {
    if (STATE.done) return;
    const done = boardEl.querySelectorAll('.piece.locked').length === STATE.n * STATE.n;
    if (done) {
      STATE.done = true;
      messageEl.className = 'good';
      messageEl.textContent = '🎉 Great job! You finished the puzzle!';
      celebrate (getQueryParam("level")||"easy");
      window.MindBitsProgress?.markDoneToday(`jigsaw-${(getQueryParam("level")||"easy").toLowerCase()}`);
    }
  }

  function returnLoosePieces() {
    boardEl.querySelectorAll('.piece:not(.locked)').forEach(sendToTray);
    selectPiece(null);
    updateProgress();
  }

  // -----------------------
  // Start
  // -----------------------
  async function bootstrap() {
    STATE.n = getParams().n;

    const list = await loadImageList();
    const images = list.images || [];
    if (!images.length) throw new Error('No images available');
    const chosen = images[0];

    let img;
    try {
      img = await loadImage(chosen.src);
    } catch (e) {
      img = await loadImage('https://picsum.photos/1200');
    }
    STATE.src = img.currentSrc || img.src;
    STATE.aspect = img.naturalWidth / img.naturalHeight || 1;
    previewEl.src = STATE.src;

    buildPuzzle();

    // Start over: clears the board too, so no piece is ever duplicated
    document.getElementById('reshuffleBtn').addEventListener('click', buildPuzzle);
    document.getElementById('returnLooseBtn').addEventListener('click', returnLoosePieces);
  }

  bootstrap();
  if (window.self !== window.top) {
    document.body.classList.add('embedded');
  }
  </script>
</body>
</html>
